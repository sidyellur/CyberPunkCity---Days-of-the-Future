<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060c" />
  <title>CyberPunk City: Days of the Future</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui" class="hidden">
    <div id="top">
      <div id="chips"></div>
      <div id="tools">
        <button id="pause" title="Pause">❚❚</button>
        <button id="speed" title="Game speed">1×</button>
        <button id="view" title="Switch between the skyline and street level">Street</button>
        <button id="glow" title="Glow effect (turn off on slower devices)" class="on">Glow</button>
        <button id="menu" title="Menu">☰</button>
      </div>
    </div>
    <div id="toasts"></div>
    <div id="mid">
      <aside id="architect"></aside>
      <aside id="site" class="empty"></aside>
    </div>
    <div id="hint"></div>
    <button id="walk-hold" hidden>Hold to walk</button>
  </div>
  <div id="overlay"></div>
  <script type="module" src="/src/city/main.ts"></script>
</body>
</html>
