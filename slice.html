<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060c" />
  <title>CyberPunk City | District 07, 2250</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui">
    <header>
      <div class="brand">CYBERPUNK <span>CITY</span> · 2250</div>
      <div id="status" aria-live="polite"></div>
      <div class="meter"><div id="meter-fill"></div></div>
    </header>
    <div id="hint"></div>
    <button id="walk-hold" hidden>Hold to walk</button>
    <footer>
      <div class="group">
        <label>Brief the Architect</label>
        <div class="seg" id="intents"></div>
        <div id="blurb"></div>
      </div>
      <div class="group">
        <label>View</label>
        <div class="seg">
          <button id="view-sky" class="on">Skyline</button>
          <button id="view-street">Street</button>
        </div>
      </div>
      <div class="group">
        <label>Build</label>
        <div class="seg">
          <button id="rebuild">Raise a new district</button>
          <button id="skip">Finish now</button>
        </div>
      </div>
      <div class="group">
        <label>Atmosphere</label>
        <div class="seg">
          <button id="rain" class="on">Rain</button>
          <button id="glow" class="on">Glow</button>
        </div>
      </div>
    </footer>
  </div>
  <script type="module" src="/src/slice/main.ts"></script>
</body>
</html>
